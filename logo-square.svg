<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- novalis ロゴの元データ（四角・角なし）：iPhone のホーム画面アイコンなど、角丸を自動でつける場所用 -->
  <defs>
    <pattern id="slash" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="3" height="22" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
    <linearGradient id="fade" x1="1" y1="0" x2="0.3" y2="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="512" height="512" fill="url(#fade)"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow-dot" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="512" height="512" fill="#0b0b0d"/>
  <rect width="512" height="512" fill="url(#slash)" mask="url(#m)"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#6f9fd4" stroke-width="60" opacity="0.55" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#6f9fd4" stroke-width="60"/>
  <circle cx="161.2" cy="161.2" r="30" fill="#ffffff" opacity="0.8" filter="url(#glow-dot)"/>
  <circle cx="161.2" cy="161.2" r="21" fill="#ffffff"/>
</svg>
