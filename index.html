<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゆるりツールズ｜ちょっと便利な、ゆるい道具箱</title>
  <meta name="description" content="ゆるりツールズは、暮らしのちょっとした「どっちがいい？」「どうしよう？」に役立つ無料Webツール集です。">
  <meta name="theme-color" content="#07080f">
  <!-- サイトのアイコン（ブラウザのタブ・スマホのホーム画面） -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- フォント（Google Fonts・無料） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景のオーロラと格子（飾り） -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid"></span>
  </div>

  <header class="hero">
    <p class="hero-label"><span class="dot"></span>FREE WEB TOOLS</p>
    <h1 class="hero-title">
      <span class="hero-en" aria-hidden="true">YURURI<br>TOOLS</span>
      <span class="hero-ja">ゆるりツールズ</span>
    </h1>
    <p class="hero-lead">暮らしの「どっちがいい？」「どうしよう？」を<br class="br-sp">さくっと解決する、ゆるい道具箱。</p>
    <a class="hero-cta" href="#tools">ツールを見る<span aria-hidden="true">↓</span></a>
  </header>

  <main class="container" id="tools">
    <section aria-labelledby="tools-heading">
      <div class="section-head">
        <h2 id="tools-heading" class="section-title">
          <span class="section-en" aria-hidden="true">TOOLS</span>
          ツール一覧
        </h2>
        <span id="tool-count" class="count"></span>
      </div>

      <!-- ツールのカードは tools.js の内容から自動で作られます -->
      <ul id="tool-list" class="tool-list"></ul>

      <!-- JavaScriptが動かないときのための予備のリンク -->
      <noscript>
        <ul class="tool-list">
          <li><a class="tool-card" href="https://yururi-tools.github.io/highway-cost/">高速と下道の費用比較</a></li>
          <li><a class="tool-card" href="https://yururi-tools.github.io/sai-slot/">サイ⚪︎スロット</a></li>
        </ul>
      </noscript>

      <p class="coming-soon"><span class="pulse" aria-hidden="true"></span>これからもツールを増やしていきます</p>
    </section>

    <!-- 広告スペース：将来ここに広告のコードを貼り付けます -->
    <aside class="ad-slot" aria-label="広告">
      <!-- 例：Google AdSense のコードをこの中に貼る -->
      <span class="ad-placeholder">広告スペース</span>
    </aside>
  </main>

  <footer class="site-footer">
    <p class="footer-logo" aria-hidden="true">YURURI TOOLS</p>
    <p>© <span id="year"></span> ゆるりツールズ</p>
  </footer>

  <!-- ツールの一覧を先に読み込み、そのあとカードを作るプログラムを読み込みます -->
  <script src="tools.js"></script>
  <script src="main.js"></script>
</body>
</html>
