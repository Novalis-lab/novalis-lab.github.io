<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゆるりツールズ｜ちょっと便利な、ゆるい道具箱</title>
  <meta name="description" content="ゆるりツールズは、暮らしのちょっとした「どっちがいい？」「どうしよう？」に役立つ無料Webツール集です。">
  <meta name="theme-color" content="#fff8ee">
  <!-- フォント（Google Fonts・無料） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="logo-mark" aria-hidden="true">🧺</p>
    <h1 class="site-name">ゆるりツールズ</h1>
    <p class="tagline">ちょっと便利な、ゆるい道具箱</p>
  </header>

  <main class="container">
    <section aria-labelledby="tools-heading">
      <h2 id="tools-heading" class="section-title">
        ツール一覧 <span id="tool-count" class="count"></span>
      </h2>

      <!-- ツールのカードは tools.js の内容から自動で作られます -->
      <ul id="tool-list" class="tool-list"></ul>

      <!-- JavaScriptが動かないときのための予備のリンク -->
      <noscript>
        <ul class="tool-list">
          <li><a class="tool-card" href="https://yururi-tools.github.io/highway-cost/">高速と下道の費用比較</a></li>
          <li><a class="tool-card" href="https://yururi-tools.github.io/sai-slot/">サイ⚪︎スロット</a></li>
        </ul>
      </noscript>

      <p class="coming-soon">これからもツールを増やしていきます 🌱</p>
    </section>

    <!-- 広告スペース：将来ここに広告のコードを貼り付けます -->
    <aside class="ad-slot" aria-label="広告">
      <!-- 例：Google AdSense のコードをこの中に貼る -->
      <span class="ad-placeholder">広告スペース</span>
    </aside>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> ゆるりツールズ</p>
  </footer>

  <!-- ツールの一覧を先に読み込み、そのあとカードを作るプログラムを読み込みます -->
  <script src="tools.js"></script>
  <script src="main.js"></script>
</body>
</html>
